name: Gerson Lehrman Group (GLG)
description: 'Gerson Lehrman Group (GLG) is the world''s leading platform for trusted human expertise,
  connecting organizations with a network of senior-level subject-matter experts to inform strategic
  decision-making. For more than 25 years GLG has facilitated expert calls and meetings, on-demand
  expert content and transcripts, quantitative and qualitative research and surveys, in-person and
  virtual events, and advisory and placement engagements. Its myGLG platform layers AI-powered and
  agentic research tools over that expert network. GLG was surfaced as a portfolio company of
  Bessemer Venture Partners and added to the API Evangelist network. GLG operates no public developer
  API or documented developer program; this profile captures its public identity, legal, and security
  surface.'
